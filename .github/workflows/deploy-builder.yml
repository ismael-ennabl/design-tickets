name: Deploy Builder

on:
  push:
    branches: [main]
    paths:
      - 'builder/**'
      - 'youtrack/_design_system/**'
      - 'youtrack/_shared/icons.jsx'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: builder

      - name: Build
        run: npm run build
        working-directory: builder
        env:
          VITE_API_URL: ${{ secrets.BUILDER_API_URL }}

      - name: Commit builder-app to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builder-app/
          git diff --staged --quiet || git commit -m "build: update builder-app [skip ci]"
          git push
