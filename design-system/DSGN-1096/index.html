<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ennabl AI · Assistant suggestions — design comparison</title>
<link rel="stylesheet" href="../_design_system/colors_and_type.css" />
<link rel="icon" href="../_design_system/logos/ennabl-favicon.svg" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--en-bg-grey);
    color: var(--en-fg);
    font-family: var(--en-font-sans);
    overflow: hidden;
  }

  /* ---------- Page chrome: tabs + design stage ---------- */
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 56px 1fr;
  }

  /* Tabs replace the former modal header */
  .tabs {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: var(--en-bg);
    border-bottom: 1px solid var(--en-divider);
    padding: 0 16px;
  }
  .tab {
    position: relative;
    height: 56px;
    padding: 0 16px;
    background: transparent;
    border: 0;
    color: var(--en-fg-secondary);
    font: 600 14px/16px var(--en-font-sans);
    letter-spacing: 0.15px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color var(--en-duration-shortest) var(--en-easing);
  }
  .tab:hover { color: var(--en-fg); }
  .tab[aria-selected="true"] { color: var(--en-primary); }
  .tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; bottom: -1px;
    height: 2px;
    background: var(--en-primary);
    border-radius: 2px 2px 0 0;
  }
  .tab .ico { width: 16px; height: 16px; display: grid; place-items: center; }

  .tabs .spacer { flex: 1; }
  .tabs .meta {
    align-self: center;
    font: 400 12px/16px var(--en-font-sans);
    letter-spacing: 0.17px;
    color: var(--en-fg-secondary);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-right: 8px;
  }
  .tabs .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--en-success); }

  /* Design stage: each tab is one layout preview */
  .stage { position: relative; overflow: hidden; }
  .panel { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity var(--en-duration-short) var(--en-easing); }
  .panel.active { opacity: 1; pointer-events: auto; }

  /* ============================================================
     Shared composer + suggestion building blocks
     ============================================================ */
  .composer {
    background: var(--en-bg);
    border: 1px solid var(--en-divider);
    border-radius: 999px;
    padding: 6px 6px 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color var(--en-duration-short) var(--en-easing);
  }
  .composer:focus-within { border-color: var(--en-primary); }
  .composer .input {
    flex: 1;
    height: 28px;
    border: 0;
    outline: 0;
    background: transparent;
    font: 400 14px/22px var(--en-font-sans);
    letter-spacing: 0.15px;
    color: var(--en-fg);
  }
  .composer .input::placeholder { color: var(--en-fg-secondary); }
  .composer .send { background: none; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; }
  .composer .send img { width: 28px; height: 28px; display: block; }
  .composer .send img[hidden] { display: none; }
  .composer .send.enabled[data-state="off"] { opacity: 1; }
  .composer .send[data-state="off"] { cursor: default; }

  /* Composer multi-line (full-page variant) */
  .composer.multiline { border-radius: 16px; padding: 12px 12px 8px 16px; flex-direction: column; align-items: stretch; gap: 4px; }
  .composer.multiline .input { height: auto; min-height: 28px; max-height: 160px; resize: none; padding: 6px 0 2px; font-size: 15px; }
  .composer.multiline .toolbar { display: flex; align-items: center; gap: 8px; }
  .composer.multiline .toolbar .send { margin-left: auto; }
  .icon-btn {
    height: 32px; min-width: 32px; padding: 0 8px;
    border-radius: 8px; background: transparent; border: 0;
    color: var(--en-icon);
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
    font: 400 13px/16px var(--en-font-sans);
    letter-spacing: 0.15px;
    transition: background-color var(--en-duration-shortest) var(--en-easing);
  }
  .icon-btn:hover { background: var(--en-action-hover); }
  .icon-btn img { width: 16px; height: 16px; display: block; }

  /* Section label */
  .section-label {
    font: 400 13px/16px var(--en-font-sans);
    letter-spacing: 0.17px;
    color: var(--en-fg-secondary);
  }

  /* ============================================================
     LAYOUT A — Full page assistant
     ============================================================ */
  #panel-full {
    display: flex; flex-direction: column;
    background: var(--en-bg-grey);
  }
  #panel-full .scroll { flex: 1; overflow: auto; padding: 48px 24px 16px; }
  .full-canvas {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    padding-top: 32px;
    padding-bottom: 8px;
  }
  .hero h1 {
    font: 700 32px/40px var(--en-font-sans);
    letter-spacing: 0.25px;
    color: var(--en-fg);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .hello-sparkle { width: 32px; height: 32px; flex-shrink: 0; display: block; }

  /* full-page composer block */
  .composer.full-block {
    border-radius: 16px;
    padding: 16px 16px 12px 20px;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .composer.full-block .input {
    height: auto; min-height: 44px; max-height: 200px;
    resize: none;
    padding: 6px 0 2px;
    font-size: 15px;
    line-height: 22px;
  }
  .composer.full-block .toolbar {
    display: flex; align-items: center; gap: 8px;
  }
  .composer.full-block .toolbar .send { margin-left: auto; }

  .chip-btn {
    height: 36px;
    padding: 0 14px;
    border-radius: 8px;
    background: var(--en-bg);
    border: 1px solid #8287B0;
    color: var(--en-fg);
    font: 500 13px/16px var(--en-font-sans);
    letter-spacing: 0.15px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition:
      background-color var(--en-duration-shortest) var(--en-easing),
      border-color var(--en-duration-shortest) var(--en-easing);
  }
  .chip-btn:hover { background: var(--en-action-hover); border-color: var(--en-primary); }
  .chip-btn svg { color: #8287B0; }
  .chip-btn[aria-expanded="true"] { border-color: var(--en-primary); background: var(--en-action-hover); }

  .chip-wrap { position: relative; }
  .chip-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 240px;
    background: var(--en-bg);
    border-radius: 12px;
    border: 1px solid var(--en-divider);
    box-shadow: var(--en-shadow-menu);
    padding: 8px;
    display: flex; flex-direction: column; gap: 4px;
    z-index: 20;
  }
  .chip-menu[hidden] { display: none; }
  .chip-menu-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    height: 32px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    border-radius: 8px;
    color: var(--en-fg);
    font: 400 14px/20px var(--en-font-sans);
    letter-spacing: 0.15px;
    cursor: pointer;
    text-align: left;
    transition: background-color var(--en-duration-shortest) var(--en-easing);
  }
  .chip-menu-item:hover { background: var(--en-action-hover); }
  .chip-menu-item svg, .chip-menu-item img { color: var(--en-icon); flex-shrink: 0; width: 20px; height: 20px; display: block; }

  /* ---------- Attached doc / workflow chips ---------- */
  .chips {
    display: flex;
    flex-wrap: nowrap;
    gap: 12px;
    padding: 14px 0 12px;
    overflow-x: auto;
    overflow-y: hidden;
    /* hide scrollbar by default — reveal on hover */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .chips::-webkit-scrollbar { height: 0; background: transparent; }
  .chips:hover { scrollbar-width: thin; }
  .chips:hover::-webkit-scrollbar { height: 6px; }
  .chips:hover::-webkit-scrollbar-thumb {
    background: var(--en-border);
    border-radius: 3px;
  }
  .chips:hover::-webkit-scrollbar-thumb:hover { background: var(--en-icon-secondary); }
  .chips:hover::-webkit-scrollbar-track { background: transparent; }
  .chips:empty { display: none; }

  .doc-chip {
    position: relative;
    width: 168px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    background: var(--en-bg);
    border: 1px solid #E5EDFA;
    box-sizing: border-box;
  }
  .doc-chip.workflow {
    background: var(--en-bg);
    border-color: #E5EDFA;
  }
  .doc-chip .doc-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .doc-chip .doc-icon.pdf {
    background: #FF5C4D;
    color: white;
  }
  .doc-chip .doc-icon.xls {
    background: #21A66B;
    color: white;
  }
  .doc-chip .doc-icon.workflow {
    background: rgba(113, 254, 214, 0.10);
    color: #0FAE8A;
  }
  .doc-chip .doc-icon svg { width: 20px; height: 20px; display: block; }
  .doc-chip .doc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .doc-chip .doc-title {
    font: 500 12px/16px var(--en-font-sans);
    letter-spacing: 0.17px;
    color: var(--en-fg);
    /* single-line truncation */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .doc-chip .doc-tag {
    font: 400 11px/14px var(--en-font-sans);
    letter-spacing: 0.17px;
    color: var(--en-fg-secondary);
    text-transform: uppercase;
  }
  .doc-chip .doc-close {
    position: absolute;
    top: -8px; right: -8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #3B3B3B;
    color: white;
    border: 0;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.18);
    transition: background-color var(--en-duration-shortest) var(--en-easing);
    z-index: 2;
  }
  .doc-chip .doc-close:hover { background: #1E1E1E; }
  .doc-chip .doc-close svg { width: 8px; height: 8px; }

  /* tooltip rendered via JS fixed div to escape overflow:hidden on .chips */
  .chip-tip {
    position: fixed;
    background: #1E1E1E;
    color: white;
    font: 400 12px/16px var(--en-font-sans);
    letter-spacing: 0.17px;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 9999;
    pointer-events: none;
    box-shadow: var(--en-shadow-tooltip);
    opacity: 0;
    transition: opacity 80ms;
  }
  .chip-tip.visible { opacity: 1; }

  /* full-page suggestions list: 2-col rows */
  .full-suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 720px) { .full-suggestions { grid-template-columns: 1fr; } }
  .fs-row {
    background: var(--en-bg);
    border: 1px solid var(--en-divider);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    text-align: left;
    transition:
      background-color var(--en-duration-shortest) var(--en-easing),
      border-color var(--en-duration-shortest) var(--en-easing);
  }
  .fs-row:hover { background: var(--en-action-hover); border-color: var(--en-border); }
  .fs-row .fs-name {
    flex: 1;
    font: 500 14px/20px var(--en-font-sans); letter-spacing: 0.15px; color: var(--en-fg);
  }
  .fs-row .fs-chev { color: var(--en-icon-secondary); flex-shrink: 0; }
  .fs-row:hover .fs-chev { color: var(--en-primary); }

  /* ============================================================
     LAYOUT B — Side panel (right-docked)
     ============================================================ */
  #panel-side { display: flex; }
  /* simulated app behind so the side panel feels docked */
  .behind {
    flex: 1;
    background:
      radial-gradient(1200px 600px at 20% -10%, hsla(218, 67%, 96%, 0.8), transparent 60%),
      var(--en-bg-grey);
    overflow: hidden;
    border-right: 1px solid var(--en-divider);
  }
  .behind-top {
    height: 56px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px;
    background: var(--en-bg);
    border-bottom: 1px solid var(--en-divider);
  }
  .behind-top img.logo { height: 20px; display: block; }
  .behind-top .crumb {
    font: 500 14px/16px var(--en-font-sans); letter-spacing: 0.1px; color: var(--en-fg);
  }
  .behind-top .crumb .muted { color: var(--en-fg-secondary); font-weight: 400; }
  .behind-body {
    padding: 24px;
    overflow: auto;
  }
  /* Placeholder content blocks behind */
  .ph-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .ph-card { background: var(--en-bg); border: 1px solid var(--en-divider); border-radius: 16px; padding: 16px; min-height: 92px; display: flex; flex-direction: column; gap: 8px; }
  .ph-card .ph-label { height: 8px; width: 60%; border-radius: 4px; background: var(--en-bg-dark-grey); }
  .ph-card .ph-num   { height: 22px; width: 50%; border-radius: 4px; background: var(--en-divider); }
  .ph-card .ph-trend { height: 6px; width: 70%; border-radius: 4px; background: var(--en-bg-dark-grey); opacity: 0.7; }
  .ph-chart { background: var(--en-bg); border: 1px solid var(--en-divider); border-radius: 16px; padding: 16px; height: 320px; display: flex; flex-direction: column; gap: 12px; }
  .ph-chart-title { height: 10px; width: 200px; border-radius: 4px; background: var(--en-bg-dark-grey); }
  .ph-chart-bars {
    flex: 1;
    display: grid;
    grid-template-rows: repeat(8, 1fr);
    gap: 10px;
    align-items: stretch;
  }
  .ph-bar {
    background: hsla(260, 73%, 54%, 0.18);
    border-radius: 0 4px 4px 0;
    height: 100%;
  }
  .ph-bar.tall { background: var(--en-data-personal); opacity: 0.9; }

  /* Side panel itself */
  .side-panel {
    width: 480px;
    flex-shrink: 0;
    background: var(--en-bg);
    border-left: 1px solid var(--en-divider);
    display: grid;
    grid-template-rows: 64px 1fr auto;
    box-shadow: -8px 0 24px rgba(27, 35, 55, 0.04);
  }
  @media (max-width: 1100px) { .side-panel { width: 440px; } }
  @media (max-width: 900px)  { .side-panel { width: 380px; } }

  .sp-head {
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--en-divider);
  }
  .sp-head .close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--en-divider);
    background: var(--en-bg);
    cursor: pointer;
    display: grid; place-items: center;
    color: var(--en-icon);
    transition: background-color var(--en-duration-shortest) var(--en-easing);
  }
  .sp-head .close:hover { background: var(--en-action-hover); }
  .sp-head .close img { width: 12px; height: 12px; }
  .sp-head .title {
    justify-self: center;
    display: inline-flex; align-items: center; gap: 8px;
    font: 700 16px/20px var(--en-font-sans); letter-spacing: 0.15px; color: var(--en-fg);
  }
  .sp-head .sparkle {
    width: 20px; height: 20px; display: block;
  }

  .sp-body { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .sp-suggestions-label {
    font: 400 12px/16px var(--en-font-sans);
    letter-spacing: 0.17px;
    color: var(--en-fg-secondary);
    padding: 0 4px;
  }

  .sp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .sp-row {
    background: var(--en-bg);
    border: 1px solid var(--en-divider);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    transition:
      background-color var(--en-duration-shortest) var(--en-easing),
      border-color var(--en-duration-shortest) var(--en-easing);
    text-align: left;
  }
  .sp-row:hover { background: var(--en-action-hover); border-color: var(--en-border); }
  .sp-row .sp-badge {
    width: 24px; height: 24px; border-radius: 8px;
    background: var(--en-action-hover); color: var(--en-primary);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .sp-row .sp-badge img { width: 14px; height: 14px; }
  .sp-row .sp-name {
    flex: 1;
    font: 500 13px/16px var(--en-font-sans); letter-spacing: 0.15px; color: var(--en-fg);
  }
  .sp-row .sp-chev { color: var(--en-icon-secondary); flex-shrink: 0; }
  .sp-row[aria-expanded="true"] .sp-chev { transform: rotate(90deg); color: var(--en-primary); }
  .sp-row[aria-expanded="true"] { background: var(--en-action-hover); border-color: var(--en-primary); }

  /* expanded prompt list */
  .sp-expand {
    grid-column: 1 / -1;
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 4px 4px 8px;
  }
  .sp-expand.open { display: flex; }
  .sp-prompt {
    text-align: left;
    background: var(--en-bg-grey);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    font: 400 13px/18px var(--en-font-sans);
    letter-spacing: 0.15px;
    color: var(--en-fg);
    transition: background-color var(--en-duration-shortest) var(--en-easing);
    display: flex; align-items: center; gap: 8px;
  }
  .sp-prompt:hover { background: var(--en-action-hover); }
  .sp-prompt .chev { margin-left: auto; color: var(--en-primary); opacity: 0; transition: opacity var(--en-duration-shortest) var(--en-easing); flex-shrink: 0; }
  .sp-prompt:hover .chev { opacity: 1; }

  .sp-foot {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--en-divider);
    background: var(--en-bg);
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--en-logo-primary);
    color: white;
    font: 500 13px/16px var(--en-font-sans);
    letter-spacing: 0.15px;
    padding: 10px 14px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--en-duration-short) var(--en-easing), transform var(--en-duration-short) var(--en-easing);
    z-index: 60;
    box-shadow: var(--en-shadow-menu);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Suggestions dialog ---------- */
  .sg-scrim {
    position: fixed; inset: 0;
    background: rgba(27, 35, 55, 0.32);
    display: grid; place-items: center;
    padding: 32px 16px;
    opacity: 0; pointer-events: none;
    transition: opacity var(--en-duration-short) var(--en-easing);
    z-index: 70;
  }
  .sg-scrim.open { opacity: 1; pointer-events: auto; }
  .sg-modal {
    background: var(--en-bg);
    border: 1px solid var(--en-divider);
    border-radius: 16px;
    width: min(560px, 100%);
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    box-shadow: 0 24px 56px rgba(27, 35, 55, 0.18);
    transform: translateY(8px) scale(0.99);
    transition: transform var(--en-duration-short) var(--en-easing);
  }
  .sg-modal.show-all { width: min(960px, 100%); }
  .sg-scrim.open .sg-modal { transform: none; }
  .sg-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 18px 14px 20px;
  }
  .sg-head h2 {
    flex: 1;
    font: 700 18px/24px var(--en-font-sans);
    letter-spacing: 0.15px;
    color: var(--en-fg);
  }
  .sg-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: transparent; border: 0;
    cursor: pointer;
    display: grid; place-items: center;
    color: var(--en-icon);
    transition: background-color var(--en-duration-shortest) var(--en-easing);
  }
  .sg-close:hover { background: var(--en-action-hover); }
  .sg-close img { width: 12px; height: 12px; }
  .sg-body {
    padding: 0 18px 18px;
    display: flex; flex-direction: column; gap: 8px;
    overflow: auto;
  }
  .sg-prompt {
    text-align: left;
    background: var(--en-bg-grey);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    font: 400 14px/20px var(--en-font-sans);
    letter-spacing: 0.15px;
    color: var(--en-fg);
    transition: background-color var(--en-duration-shortest) var(--en-easing);
    display: flex; align-items: center; gap: 8px;
  }
  .sg-prompt:hover { background: var(--en-action-hover); }
  .sg-prompt .chev {
    margin-left: auto;
    opacity: 0; color: var(--accent, var(--en-primary));
    transition: opacity var(--en-duration-shortest) var(--en-easing);
    flex-shrink: 0;
  }
  .sg-prompt:hover .chev { opacity: 1; }
  .sg-foot {
    padding: 4px 18px 18px;
    display: flex;
    justify-content: center;
  }
  .sg-link {
    background: none;
    border: 0;
    padding: 6px 8px;
    color: var(--en-primary);
    font: 500 13px/16px var(--en-font-sans);
    letter-spacing: 0.15px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 6px;
    transition: background-color var(--en-duration-shortest) var(--en-easing), color var(--en-duration-shortest) var(--en-easing);
  }
  .sg-link:hover { background: var(--en-action-hover); color: var(--en-primary-dark); }

  /* Show-all grid (all categories at once) */
  .sg-all-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 720px) { .sg-all-grid { grid-template-columns: 1fr; } }
  .sg-all-card {
    background: var(--en-bg);
    border: 1px solid var(--en-divider);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sg-all-card .sg-all-title {
    font: 600 14px/20px var(--en-font-sans); letter-spacing: 0.15px; color: var(--en-fg);
  }
  .sg-all-card .prompts { display: flex; flex-direction: column; gap: 6px; }

  /* show-more link below home suggestion rows */
  .home-showall {
    display: flex; justify-content: center;
    padding: 4px 0 8px;
  }
</style>

<body>

  <div class="toast" id="toast">Added to composer</div>

  <!-- Suggestions dialog (opens from Full page rows) -->

        <button class="sg-link" id="sg-showall">Show all suggestions</button>

<script>
  const CATEGORIES = [
    {
      key: 'policy', title: 'Policy analysis', icon: '../_design_system/icons/document.svg',
      accent: 'hsla(260, 73%, 54%, 1)',
      prompts: [
        'Summarize the key coverages and limits in this policy',
        'List all exclusions in this GL policy',
        'What endorsements are attached to this BOP?',
      ],
    },
    {
      key: 'coverage', title: 'Coverage comparison', icon: '../_design_system/icons/cards.svg',
      accent: 'hsla(324, 100%, 54%, 1)',
      prompts: [
        'Compare these two commercial auto quotes',
        'How does the renewal differ from last year\u2019s policy?',
        'Which carrier offers broader product liability coverage?',
      ],
    },
    {
      key: 'gap', title: 'Gap & risk analysis', icon: '../_design_system/icons/info.svg',
      accent: 'hsla(25, 97%, 54%, 1)',
      prompts: [
        'What gaps exist between this policy and the client\u2019s operations?',
        'Is this contractor adequately covered for completed operations?',
        'Flag any coverage concerns in this dec page',
      ],
    },
    {
      key: 'proposal', title: 'Client proposals', icon: '../_design_system/icons/reports.svg',
      accent: 'hsla(156, 61%, 50%, 1)',
      prompts: [
        'Create a proposal for this BOP quote in plain language',
        'Write an executive summary of this commercial package',
        'Draft a proposal comparing our quote vs the incumbent',
      ],
    },
    {
      key: 'renewal', title: 'Renewal prep', icon: '../_design_system/icons/renewals.svg',
      accent: 'hsla(209, 100%, 50%, 1)',
      prompts: [
        'Summarize what\u2019s changing at renewal',
        'Draft a renewal letter explaining the premium increase',
        'Prepare a renewal submission summary for underwriting',
      ],
    },
    {
      key: 'compli', title: 'Compliance & requirements', icon: '../_design_system/icons/lock.svg',
      accent: 'hsla(255, 72%, 54%, 1)',
      prompts: [
        'Does this policy meet the contract\u2019s insurance requirements?',
        'What\u2019s missing from this COI based on the lease agreement?',
        'Does the additional insured endorsement match what\u2019s required?',
      ],
    },
  ];

  /* ---------- Full page suggestion rows ---------- */
  const fullGrid = document.getElementById('full-grid');
  fullGrid.innerHTML = CATEGORIES.map((c, i) => `
    <button class="fs-row" type="button" data-cat="${i}">
      <span class="fs-name">${c.title}</span>
      <svg class="fs-chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  `).join('');

  /* ---------- Add Documents menu ---------- */
  const addBtn = document.getElementById('add-docs-btn');
  const addMenu = document.getElementById('add-docs-menu');
  const wfBtn = document.getElementById('wf-btn');
  const wfMenu = document.getElementById('wf-menu');
  const chipsEl = document.getElementById('composer-chips');

  const FAKE_DOCS = [
    { title: '25-26 Acme Commercial Renewal Policy', type: 'pdf' },
    { title: '2026 Acme Commercial Audit Statement', type: 'xls' },
    { title: '25-26 Acme Commercial Application', type: 'pdf' },
    { title: 'Acme Manufacturing Loss Run Report 2024', type: 'xls' },
    { title: 'Acme Holdings Certificate of Insurance', type: 'pdf' },
    { title: 'Acme Mfg Workers Comp Dec Page 2025', type: 'pdf' },
  ];
  let docIdx = 0;

  function toggleMenu(btn, menu) {
    [addMenu, wfMenu].forEach(m => {
      if (m !== menu) { m.hidden = true; m.previousElementSibling.setAttribute('aria-expanded', 'false'); }
    });
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function closeAllMenus() {
    [addMenu, wfMenu].forEach(m => {
      m.hidden = true;
      m.previousElementSibling.setAttribute('aria-expanded', 'false');
    });
  }

  addBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(addBtn, addMenu); });
  wfBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(wfBtn, wfMenu); });
  document.addEventListener('click', (e) => {
    if (![addBtn, addMenu, wfBtn, wfMenu].some(el => el.contains(e.target))) closeAllMenus();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllMenus(); });

  const FILE_ICONS = {
    pdf: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 3v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="17.2" font-family="Inter, sans-serif" font-size="5.2" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">PDF</text>
    </svg>`,
    xls: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 3v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="17.2" font-family="Inter, sans-serif" font-size="5.2" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">XLS</text>
    </svg>`,
    workflow: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M19.1923 5.80816L16.6923 3.30816C16.575 3.19088 16.4159 3.125 16.2501 3.125C16.0842 3.125 15.9252 3.19088 15.8079 3.30816C15.6906 3.42544 15.6247 3.5845 15.6247 3.75035C15.6247 3.9162 15.6906 4.07526 15.8079 4.19253L17.2415 5.62535H16.2501C12.3962 5.62535 11.4805 7.82222 10.6735 9.75972C9.94071 11.5183 9.35164 12.9308 6.80789 13.1066C6.64827 12.3488 6.21295 11.6773 5.58634 11.2222C4.95974 10.7671 4.18648 10.5609 3.41648 10.6436C2.64648 10.7262 1.9346 11.0918 1.41885 11.6695C0.903097 12.2472 0.620221 12.9959 0.625061 13.7703C0.629901 14.5447 0.922112 15.2897 1.44504 15.8609C1.96797 16.4321 2.68437 16.7888 3.45534 16.8618C4.22631 16.9348 4.99694 16.719 5.61781 16.2561C6.23868 15.7932 6.66556 15.1163 6.81571 14.3566C10.1954 14.1496 11.061 12.0793 11.8266 10.2402C12.6102 8.35972 13.229 6.87535 16.2501 6.87535H17.2415L15.8079 8.30816C15.6906 8.42544 15.6247 8.5845 15.6247 8.75035C15.6247 8.9162 15.6906 9.07526 15.8079 9.19254C15.9252 9.30981 16.0842 9.37569 16.2501 9.3757C16.4159 9.3757 16.575 9.30981 16.6923 9.19254L19.1923 6.69254C19.2504 6.63449 19.2965 6.56556 19.3279 6.48969C19.3594 6.41381 19.3756 6.33248 19.3756 6.25035C19.3756 6.16821 19.3594 6.08688 19.3279 6.01101C19.2965 5.93514 19.2504 5.86621 19.1923 5.80816ZM3.75008 15.6253C3.37924 15.6253 3.01673 15.5154 2.70839 15.3094C2.40004 15.1033 2.15972 14.8105 2.01781 14.4679C1.87589 14.1253 1.83876 13.7483 1.91111 13.3846C1.98346 13.0208 2.16203 12.6867 2.42426 12.4245C2.68648 12.1623 3.02057 11.9837 3.38429 11.9114C3.748 11.839 4.125 11.8762 4.46761 12.0181C4.81022 12.16 5.10306 12.4003 5.30909 12.7087C5.51511 13.017 5.62508 13.3795 5.62508 13.7503C5.62508 14.2476 5.42754 14.7245 5.07591 15.0762C4.72428 15.4278 4.24736 15.6253 3.75008 15.6253Z" fill="currentColor"></path></svg>`
  };

  function addChip(title, kind, fileType) {
    const chip = document.createElement('div');
    chip.className = 'doc-chip' + (kind === 'workflow' ? ' workflow' : '');
    chip.setAttribute('data-tip', title);
    const iconType = kind === 'workflow' ? 'workflow' : fileType;
    const tagLabel = kind === 'workflow' ? 'Workflow' : fileType.toUpperCase();
    chip.innerHTML = `
      <span class="doc-icon ${iconType}">${FILE_ICONS[iconType]}</span>
      <div class="doc-body">
        <div class="doc-title">${title}</div>
        <div class="doc-tag">${tagLabel}</div>
      </div>
      <button class="doc-close" aria-label="Remove">
        <svg viewBox="0 0 8 8" fill="none" aria-hidden="true">
          <path d="M1 1l6 6M7 1l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    `;
    chip.querySelector('.doc-close').addEventListener('click', (e) => {
      e.stopPropagation();
      chip.remove();
    });
    chipsEl.appendChild(chip);
  }

  // menu actions
  addMenu.addEventListener('click', (e) => {
    const item = e.target.closest('.chip-menu-item');
    if (!item) return;
    const doc = FAKE_DOCS[docIdx % FAKE_DOCS.length];
    docIdx++;
    addChip(doc.title, 'document', doc.type);
    closeAllMenus();
  });
  wfMenu.addEventListener('click', (e) => {
    const item = e.target.closest('.chip-menu-item');
    if (!item) return;
    addChip(item.dataset.wf, 'workflow');
    closeAllMenus();
  });
  const dialog = document.getElementById('sg-dialog');
  const dialogBody = document.getElementById('sg-dialog-body');
  const dialogTitle = document.getElementById('sg-dialog-title');
  const dialogModal = document.getElementById('sg-modal');
  const dialogFoot = document.getElementById('sg-foot');

  function openDialog(idx) {
    const c = CATEGORIES[idx];
    dialogModal.classList.remove('show-all');
    dialogTitle.textContent = c.title;
    dialogBody.innerHTML = c.prompts.map(p => `
      <button class="sg-prompt" data-target="full" data-prompt="${p.replace(/"/g,'&quot;')}">
        <span>“${p}”</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    `).join('');
    dialogFoot.style.display = '';
    dialog.classList.add('open');
    dialog.setAttribute('aria-hidden', 'false');
  }
  function openShowAll() {
    dialogModal.classList.add('show-all');
    dialogTitle.textContent = 'All suggestions';
    dialogBody.innerHTML = `<div class="sg-all-grid">${CATEGORIES.map(c => `
      <article class="sg-all-card">
        <div class="sg-all-title">${c.title}</div>
        <div class="prompts">
          ${c.prompts.map(p => `
            <button class="sg-prompt" data-target="full" data-prompt="${p.replace(/"/g,'&quot;')}">
              <span>“${p}”</span>
              <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          `).join('')}
        </div>
      </article>
    `).join('')}</div>`;
    dialogFoot.style.display = 'none';
    dialog.classList.add('open');
    dialog.setAttribute('aria-hidden', 'false');
  }
  function closeDialog() {
    dialog.classList.remove('open');
    dialog.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('sg-close').addEventListener('click', closeDialog);
  document.getElementById('sg-showall').addEventListener('click', openShowAll);
  document.getElementById('home-showall').addEventListener('click', openShowAll);
  document.getElementById('sp-showall').addEventListener('click', openShowAll);
  dialog.addEventListener('click', (e) => { if (e.target === dialog) closeDialog(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDialog(); });

  fullGrid.addEventListener('click', (e) => {
    const row = e.target.closest('.fs-row');
    if (!row) return;
    openDialog(+row.dataset.cat);
  });
  dialogBody.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-prompt]');
    if (!btn) return;
    setTimeout(closeDialog, 0);
  });

  /* ---------- Side panel grid (compact rows; tap to expand prompts) ---------- */
  const spGrid = document.getElementById('sp-grid');
  spGrid.innerHTML = CATEGORIES.map((c, i) => `
    <button class="sp-row" type="button" aria-expanded="false" data-cat="${i}">
      <span class="sp-name">${c.title}</span>
      <svg class="sp-chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  `).join('') + `<div class="sp-expand" id="sp-expand"></div>`;

  const spExpand = document.getElementById('sp-expand');

  spGrid.addEventListener('click', (e) => {
    const row = e.target.closest('.sp-row');
    if (!row) return;
    const idx = +row.dataset.cat;
    const cat = CATEGORIES[idx];
    const isOpenSame = row.getAttribute('aria-expanded') === 'true';
    // close all
    spGrid.querySelectorAll('.sp-row').forEach(r => r.setAttribute('aria-expanded', 'false'));
    if (isOpenSame) {
      spExpand.classList.remove('open');
      spExpand.innerHTML = '';
      return;
    }
    row.setAttribute('aria-expanded', 'true');
    spExpand.classList.add('open');
    spExpand.innerHTML = cat.prompts.map(p => `
      <button class="sp-prompt" data-target="side" data-prompt="${p.replace(/"/g,'&quot;')}">
        <span>“${p}”</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    `).join('');
    // Move expand block right under the row's column
    // (kept simple — full width below grid)
  });

  /* ---------- Tab switching ---------- */
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
      panels.forEach(p => p.classList.toggle('active', p.id === tab.getAttribute('aria-controls')));
    });
  });

  /* ---------- Composer state + send button toggle ---------- */
  function setSend(target, on) {
    document.querySelectorAll(`.send[data-target="${target}"]`).forEach(btn => {
      btn.dataset.state = on ? 'on' : 'off';
      btn.querySelector('[data-off]').hidden = on;
      btn.querySelector('[data-on]').hidden = !on;
    });
  }

  document.querySelectorAll('[data-composer]').forEach(el => {
    el.addEventListener('input', () => {
      if (el.tagName === 'TEXTAREA') {
        el.style.height = 'auto';
        el.style.height = Math.min(160, el.scrollHeight) + 'px';
      }
      setSend(el.dataset.composer, el.value.trim().length > 0);
    });
  });

  /* ---------- Click prompt → drop into matching composer ---------- */
  let toastT;
  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* ---------- Doc-chip tooltip (fixed-position to escape overflow:hidden) ---------- */
  const chipTip = document.createElement('div');
  chipTip.className = 'chip-tip';
  document.body.appendChild(chipTip);

  document.body.addEventListener('mouseover', (e) => {
    const chip = e.target.closest('.doc-chip[data-tip]');
    if (!chip) return;
    chipTip.textContent = chip.dataset.tip;
    chipTip.classList.add('visible');
  });
  document.body.addEventListener('mousemove', (e) => {
    const chip = e.target.closest('.doc-chip[data-tip]');
    if (!chip) { chipTip.classList.remove('visible'); return; }
    chipTip.style.left = e.clientX - chipTip.offsetWidth / 2 + 'px';
    chipTip.style.top  = e.clientY + 16 + 'px';
  });
  document.body.addEventListener('mouseout', (e) => {
    const chip = e.target.closest('.doc-chip[data-tip]');
    if (chip) chipTip.classList.remove('visible');
  });

  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-prompt]');
    if (!btn) return;
    const target = btn.dataset.target;
    const composer = document.querySelector(`[data-composer="${target}"]`);
    if (!composer) return;
    composer.value = btn.dataset.prompt;
    composer.dispatchEvent(new Event('input'));
    composer.focus();
    showToast('Added to composer');
  });
</script>
</body>
</html>
